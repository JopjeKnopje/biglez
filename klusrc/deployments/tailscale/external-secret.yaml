apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: tailscale-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: tailscale-authkey

